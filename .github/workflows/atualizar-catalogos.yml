name: Atualizar biblioteca de catalogos

on:
  push:
    branches: [main]
    paths:
      - 'pdf/**'

permissions:
  contents: write

jobs:
  gerar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Gerar a lista de catalogos
        run: node scripts/gerar-catalogos.mjs --promover-novos

      - name: Salvar a lista atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/catalogos.js index.html catalogo.html
          if git diff --cached --quiet; then
            echo "A lista ja esta atualizada."
          else
            git commit -m "Atualiza biblioteca de catalogos"
            git push
          fi
